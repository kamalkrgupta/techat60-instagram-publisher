name: Instagram daily publisher
on:
  schedule:
    # Local-time preflight and retries. GitHub may delay events; application guards remain authoritative.
    - cron: '45 18 * * *'
      timezone: Asia/Kolkata
    - cron: '0,15,30,45 19-21 * * *'
      timezone: Asia/Kolkata
    - cron: '0 22 * * *'
      timezone: Asia/Kolkata
  workflow_dispatch:
    inputs:
      mode:
        description: 'Read-only check or approved daily publication (daily/time guards apply)'
        type: choice
        options: [check, publish, catchup, special]
        default: check
      missed_date:
        description: 'Explicit catch-up only: missed local date YYYY-MM-DD'
        type: string
        default: ''
      expected_sha256:
        description: 'Explicit catch-up only: exact source SHA-256'
        type: string
        default: ''
permissions:
  contents: write
concurrency:
  group: techat60-instagram-publisher
  cancel-in-progress: false
jobs:
  instagram:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --no-cache-dir -r requirements-cloud.txt
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Run automated tests
        run: python -m unittest discover -s tests
      - name: Check or publish one Reel
        env:
          GITHUB_TOKEN: ${{ github.token }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_STATE_KEY: ${{ secrets.INSTAGRAM_STATE_KEY }}
          INSTAGRAM_CLOUD_ENABLED: ${{ secrets.INSTAGRAM_CLOUD_ENABLED }}
          CAPTION_MODE: fallback
          OPENAI_API_KEY: ''
          PUBLISH_BACKEND: github-actions
          EVENT_MODE: ${{ github.event_name == 'schedule' && 'publish' || inputs.mode }}
          MISSED_DATE: ${{ inputs.missed_date }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          SPECIAL_PROJECT_ROOT: ${{ github.workspace }}/.special-runtime/source
          SPECIAL_APPROVED_SHA: ${{ inputs.expected_sha256 }}
        run: |
          if [ "$EVENT_MODE" = "special" ]; then
            python -u publish_ai_special.py
          else
            python -u cloud_runner.py --mode "$EVENT_MODE" --missed-date "$MISSED_DATE" --expected-sha256 "$EXPECTED_SHA256"
          fi
